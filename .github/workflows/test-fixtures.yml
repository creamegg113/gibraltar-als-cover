
name: Test Gibraltar FA Fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase library
        run: npm install --no-save @supabase/supabase-js

      - name: Test Gibraltar FA fixture source
        run: node scripts/import-fixtures.js
