name: First Response - Browserless Fixture Monitor (Read Only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve all three leagues (no database writes)
        env:
          BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
        run: node scripts/browserless-fixture-monitor.js
      - name: Save snapshot and diagnostics even if a league fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-response-fixture-snapshot
          path: fixture-monitor-output/snapshot.json
          if-no-files-found: warn
          retention-days: 14
